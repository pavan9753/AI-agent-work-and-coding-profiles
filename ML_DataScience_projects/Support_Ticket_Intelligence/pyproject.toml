[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "support-ticket-intelligence"
version = "1.0.0"
description = "A text-classification triage demo with optional LLM analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.4",
  "openai>=1.66,<3",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "scikit-learn>=1.5",
  "streamlit>=1.39",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
