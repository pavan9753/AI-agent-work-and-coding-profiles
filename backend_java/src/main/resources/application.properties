spring.application.name=contact-directory-api
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/contact_directory}
spring.data.mongodb.auto-index-creation=true
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=Contact Directory API
info.app.description=Layered Spring Boot REST API backed by MongoDB
info.app.version=1.0.0
management.info.env.enabled=true
